<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free seats</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #fbfbfd;
    color: #16181d;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0e1015; color: #f2f3f7; }
    input { background: #171a21; color: inherit; border-color: #262a33; }
  }
  main { width: min(24rem, 90vw); text-align: center; }
  output { display: block; font-size: 3.5rem; font-weight: 700; margin: 1rem 0; }
  label { display: block; text-align: left; margin: .75rem 0; font-size: .9rem; }
  input {
    width: 100%;
    padding: .6rem .7rem;
    font-size: 1rem;
    border: 1px solid #d8d8e0;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <main>
    <h1>Free seats</h1>
    <output id="answer" aria-live="polite">—</output>
    <label>Seats in the library
      <input id="total" type="number" min="0" step="1" value="120">
    </label>
    <label>Seats taken
      <input id="taken" type="number" min="0" step="1" value="97">
    </label>
  </main>

  <!-- type="module" is what lets this file `import` another one. -->
  <script type="module">
    import { freeSeats } from "./seats.js";

    const total = document.querySelector("#total");
    const taken = document.querySelector("#taken");
    const answer = document.querySelector("#answer");

    function update() {
      try {
        answer.textContent = freeSeats(total.valueAsNumber, taken.valueAsNumber);
      } catch {
        answer.textContent = "—";
      }
    }

    total.addEventListener("input", update);
    taken.addEventListener("input", update);
    update();
  </script>
</body>
</html>
